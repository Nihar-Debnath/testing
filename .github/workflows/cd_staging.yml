name: Deploy to staging
on:
  push:
    branches: [ main ]

jobs:
  redeploy_everything:
    runs-on: ubuntu-latest
    name: Deploying everything to the staging cluster or in main branch
    steps:
         - run: |
            echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/ssh_key
            chmod 600 ~/ssh_key  # Correct permissions

            mkdir -p ~/.ssh
            ssh-keyscan -H 52.66.6.56 >> ~/.ssh/known_hosts  # Automatically add the SSH key
            chmod 644 ~/.ssh/known_hosts

            ssh -i ~/ssh_key ubuntu@52.66.6.56 -t "cd testing/ && git pull origin main && export PATH=/root/.nvm/versions/node/v22.13.1/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/usr/games:/usr/local/games:/snap/bin && npm install -g pnpm && pnpm install && pnpm run build && pm2 restart web && pm2 restart http-server && pm2 restart ws-server"